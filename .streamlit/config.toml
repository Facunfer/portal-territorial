[server]
# Requerido en VPS: evita que Streamlit intente abrir un navegador
headless = true
# Puerto en el que corre la app (nginx hace proxy a este puerto)
port = 8501
# CORS lo maneja nginx, no Streamlit
enableCORS = false
# Protección CSRF activa
enableXsrfProtection = true
# Tamaño máximo de archivos subidos (CSV masivo) en MB
maxUploadSize = 10

[browser]
# No enviar telemetría a Streamlit
gatherUsageStats = false

[client]
# Oculta toolbar (deploy, share, etc.) pero conserva el botón de sidebar
toolbarMode = "minimal"

[runner]
# Evita warnings de magic commands en producción
magicEnabled = false

[theme]
base = "light"
primaryColor = "#371959"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#333333"
font = "sans serif"
